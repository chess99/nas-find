name: Client Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/release.test.mjs
      - id: version
        run: node scripts/release.mjs validate

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: windows-x64
          - os: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.target }}
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Test frontend
        working-directory: desktop
        run: npm test
      - name: Test native client
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Build installer
        working-directory: desktop
        run: npm run build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --ci -- --locked
      - name: Collect installer
        run: node scripts/release.mjs stage ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.artifact }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: client-*
          merge-multiple: true
          path: dist/release
      - name: Verify assets and generate checksums
        run: node scripts/release.mjs assemble
      - name: Create release and upload installers
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/nas-find-release-draft"; then
            if [ "$(cat "$RUNNER_TEMP/nas-find-release-draft")" != true ]; then
              echo 'This version is already published; use a new version to replace installers.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "NAS Find $RELEASE_VERSION" \
              --prerelease="$RELEASE_PRERELEASE" \
              --generate-notes --notes-file dist/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/release/* --clobber
          if [ "$RELEASE_PRERELEASE" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
