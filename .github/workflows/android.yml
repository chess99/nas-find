name: Android

on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml', 'LICENSE', 'version.json', 'scripts/version.mjs']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml', 'LICENSE', 'version.json', 'scripts/version.mjs']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/version.mjs check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Test, inspect and build
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: nas-find-android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            LICENSE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: android/app/build/reports/
