<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAS Find · 文件搜索</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="explorer.css"><script type="module" src="app.js"></script></head><body>
<header><strong>NAS Find <small>文件搜索</small><small id="product-version"></small></strong><div><span id="status">未连接</span><button id="logout">退出</button></div></header><main><section id="explorer"></section></main><footer><span id="index-status">等待连接</span><button id="refresh">更新索引</button></footer>
<dialog id="login"><h2>连接 NAS Find</h2><p>输入访问密码，搜索和浏览你的文件。</p><form id="login-form"><input id="password" type="password" autocomplete="current-password" aria-label="访问密码" required><button type="submit">登录</button></form><p id="login-error"></p></dialog>
<dialog id="preview"><div class="dialog-head"><h2 id="preview-title">文件预览</h2><button id="close-preview" aria-label="关闭预览">×</button></div><p id="preview-path"></p><p id="file-meta"></p><p><a id="download" download>下载文件</a></p><div id="preview-content"></div></dialog><div id="toast" hidden role="status"></div></body></html>
