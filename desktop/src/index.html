<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NAS Find</title><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head>
<body>
<header><div class="brand"><span class="logo">N</span><strong>NAS Find</strong><span class="tag">文件搜索</span></div><div class="top-actions"><span id="connection">未连接</span><button id="settings">连接设置</button></div></header>
<main>
<form id="search-form"><div class="search-box"><span class="search-icon" aria-hidden="true">⌕</span><input id="query" aria-label="搜索文件名" placeholder="输入文件名，支持中文片段和多个关键词" autocomplete="off" autofocus disabled><kbd>Ctrl F</kbd></div><div class="filters"><label>目录 <input id="scope" placeholder="全部目录，例如 code" aria-label="目录范围"></label><label>类型 <select id="extension" aria-label="文件类型"><option value="">全部类型</option><option>pdf</option><option>docx</option><option>xlsx</option><option>pptx</option><option>md</option><option>txt</option><option>jpg</option><option>png</option><option>mp4</option><option>mkv</option><option>mp3</option><option>zip</option></select></label><button id="clear-filters" type="button">重置</button><span class="spacer"></span><button type="submit" id="search-button" disabled>搜索</button></div></form>
<div id="notice" class="notice hidden" role="status"></div>
<div class="toolbar"><strong id="count">准备好开始搜索</strong><span id="timing"></span><span class="spacer"></span><button id="open" disabled>打开</button><button id="reveal" disabled>打开位置</button><button id="copy-path" disabled>复制路径</button><button id="details" disabled>详情</button></div>
<div class="table-wrap" id="list" role="grid" aria-label="搜索结果" tabindex="0" aria-activedescendant=""><div class="table-header" role="row"><span role="columnheader">名称</span><span role="columnheader">所在目录</span><span role="columnheader">类型</span></div><div id="rows" role="rowgroup"></div><div id="empty"><div class="empty-icon">⌕</div><h1 id="empty-title">文件在 NAS，打开就在这里</h1><p id="empty-text">搜索名称后，双击文件即可用默认应用打开。</p></div></div>
<div class="selection"><span id="selected-path">Enter 打开 · Ctrl Enter 定位 · Ctrl C 复制文件 · 右键更多操作</span></div>
</main>
<footer><span class="dot" id="dot"></span><span id="index-status">等待连接</span><span class="spacer"></span><span id="path-mode">优先映射盘</span><button id="refresh-index" disabled title="手动更新 NAS 文件索引">更新索引</button></footer>
<dialog id="settings-dialog"><form id="settings-form"><div class="dialog-title"><h2>连接你的 NAS</h2><button type="button" id="close-settings" aria-label="关闭设置">×</button></div><label>搜索服务地址<input id="server" placeholder="http://192.168.0.104:8765" required></label><label>访问密码<input id="password" type="password" autocomplete="current-password" placeholder="输入 NAS Find 访问密码"></label><label class="check"><input id="remember" type="checkbox" checked>记住登录，仅此 Windows 用户可读取</label><div class="divider"></div><label>Samba 共享根路径<input id="share" placeholder="\\192.168.0.104\Disk1" required></label><div class="mapping"><label>映射盘<input id="drive" placeholder="Z:"></label><label class="check"><input id="prefer-drive" type="checkbox" checked>优先使用映射盘</label></div><p class="help">映射不匹配或不可用时使用共享路径。打开文件沿用 Windows 的共享登录权限。</p><p id="settings-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" id="disconnect">退出并忘记密码</button><span class="spacer"></span><button id="connect" class="primary" type="submit">保存并连接</button></div></form></dialog>
<dialog id="detail-dialog"><div class="dialog-title"><h2 id="detail-title">文件详情</h2><button id="close-detail" aria-label="关闭详情">×</button></div><dl><dt>位置</dt><dd id="detail-path"></dd><dt>文件大小</dt><dd id="detail-size">读取中…</dd><dt>修改时间</dt><dd id="detail-time">读取中…</dd></dl><p id="detail-error" class="error"></p><p class="help">文件信息仅在打开此面板时读取。</p></dialog>
<div id="toast" role="status" class="toast hidden"></div>
</body></html>
