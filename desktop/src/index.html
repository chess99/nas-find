<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAS Find</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="shared/explorer.css"><script type="module" src="app.js"></script></head><body>
<header><div class="brand"><span class="logo">N</span><strong>NAS Find</strong><span class="tag">文件搜索</span></div><div class="top-actions"><span id="connection">未连接</span><button id="settings">连接设置</button></div></header>
<main><section id="explorer"></section></main><footer><span class="dot" id="dot"></span><span id="index-status">等待连接</span><span class="spacer"></span><span id="path-mode"></span><button id="refresh-index">更新索引</button></footer>
<dialog id="settings-dialog"><form id="settings-form"><div class="dialog-title"><h2>连接你的 NAS</h2><button type="button" id="close-settings" aria-label="关闭设置">×</button></div><label>搜索服务地址<input id="server" required></label><label>访问密码<input id="password" type="password" autocomplete="current-password" placeholder="输入 NAS Find 访问密码"></label><label class="check"><input id="remember" type="checkbox" checked>记住登录，仅此 Windows 用户可读取</label><div class="divider"></div><label>Samba 共享根路径<input id="share" required></label><div class="mapping"><label>映射盘<input id="drive" placeholder="Z:"></label><label class="check"><input id="prefer-drive" type="checkbox" checked>优先使用映射盘</label></div><p class="help">映射不匹配或不可用时使用共享路径。打开文件沿用 Windows 的共享登录权限。</p><p id="settings-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" id="disconnect">退出并忘记密码</button><span class="spacer"></span><button id="connect" class="primary" type="submit">保存并连接</button></div></form></dialog>
<div id="toast" role="status" class="toast hidden"></div></body></html>
